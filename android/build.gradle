buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // WiroPcmAudio needs AudioFocusRequest (API 26) for call-style
        // audio focus; the fallback path in CommunicationRoute already
        // guards its own API 31+ calls separately.
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
